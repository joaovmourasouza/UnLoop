[package]
name = "unloop-cli"
description = "Linha de comando do UnLoop: hábitos, diário, notas, tarefas e foco (feita para você e para o Claude)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "unloop-cli"
path = "src/main.rs"

[dependencies]
unloop-core = { path = "../unloop-core" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
